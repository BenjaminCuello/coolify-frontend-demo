<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto Coolify</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .contenedor {
      width: 90%;
      max-width: 600px;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #555;
      line-height: 1.5;
    }

    .estado {
      margin: 20px 0;
      font-weight: bold;
      color: green;
    }

    button {
      margin-top: 15px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #ddd;
    }

    #mensaje {
      margin-top: 20px;
      font-weight: bold;
    }

    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 16px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <main>
    <div class="contenedor">
      <h1>Proyecto con Coolify</h1>

      <p>
        Página de prueba utilizada para la demostración.
        Si estás viendo esto, el servidor está funcionando correctamente.
      </p>

      <p class="estado">
        Servidor funcionando
      </p>

      <button onclick="probarPagina()">
        Probar página
      </button>

      <p id="mensaje"></p>
    </div>
  </main>

  <footer>
    Benjamín Cuello · 2026 · Cloud Computing
  </footer>

  <script>
    function probarPagina() {
      document.getElementById("mensaje").textContent =
        "Todo está funcionando correctamente.";
    }
  </script>

</body>
</html>
